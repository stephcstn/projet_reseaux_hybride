---
- name: INSTALLATION DOCKER
  hosts: server1_test
  become: true

  tasks:
    - name: Installation des paquets nécessaires pour Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg 
        state: present
        update_cache: true

    - name: Créer le dossier pour les clés GPG si inexistant
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Ajout de la clé GPG officielle de Docker (Méthode Moderne)
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Ajout du dépôt Docker (Lié à la clé .asc)
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
        state: present

    - name: Installation de Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        update_cache: true

    - name: Vérification de l'installation de Docker
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version

    - name: Affichage de la version de Docker installée
      ansible.builtin.debug:
        msg: "Docker version installed: {{ docker_version.stdout }}"
